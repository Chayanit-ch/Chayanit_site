<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work</title>
<meta name="description" content="Selected work by [NAME].">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="work">

<a class="skip-link" href="#main" data-bind="ui.skipLink">Skip to content</a>

<header class="nav" id="nav" data-nav>
  <div class="nav__location" data-bind="nav.location">[LOCATION]</div>
  <nav class="nav__pill" aria-label="Primary">
    <a data-nav-home><img class="nav__avatar" data-bind-src="nav.avatar" alt="Home" width="32" height="32"></a>
    <div class="nav__links" data-nav-links></div>
    <button class="nav__burger" type="button" data-nav-burger aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="nav__actions">
    <button class="nav__lang" id="lang-toggle" type="button" aria-label="Toggle language">
      <span class="nav__lang-label" data-lang-label>EN</span>
    </button>
  </div>
</header>

<!-- same fixed "rocket" scroll-progress guide as Home — purely driven by
     the shared --scroll-progress CSS var (see initScrollEngine in
     script.js), which every page computes regardless of content, so it
     works here with no page-specific JS. -->
<div class="scroll-progress" aria-hidden="true">
  <div class="scroll-progress__track">
    <div class="scroll-progress__fill" data-scroll-fill></div>
    <div class="scroll-progress__marker" data-scroll-marker>
      <svg viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 C16 7 17 14 15 20 L9 20 C7 14 8 7 12 2 Z" fill="currentColor"/>
        <circle cx="12" cy="11" r="2.3" fill="#2f6fb0"/>
        <path d="M9 19.5 L5.5 25.5 L9 23 Z" fill="currentColor" opacity=".75"/>
        <path d="M15 19.5 L18.5 25.5 L15 23 Z" fill="currentColor" opacity=".75"/>
        <path d="M10.4 21.5 L12 28.5 L13.6 21.5 Z" fill="#f08462"/>
      </svg>
    </div>
  </div>
</div>

<main id="main">
  <section class="scene scene--work scene--work-standalone" data-scene data-scene-name="work-index" style="min-height:100vh;">
    <!-- ambient background icons, same system as Home's — kept to margins
         since this wrapper paints above .work__field's plain in-flow
         content regardless of DOM order. -->
    <div class="scene__deco" aria-hidden="true" style="color:rgba(31,42,60,.45)">
      <span class="deco deco--ambient" style="top:8%; left:4%; font-family:monospace; font-size:1.5rem;">&lt;/&gt;</span>
      <span class="deco deco--ambient deco--star" style="top:12%; right:10%;">✦</span>
      <span class="deco deco--ambient deco--cloud" style="top:6%; right:24%; width:50px;">
        <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 30h30a9 9 0 0 0 0-18 12 12 0 0 0-23-3 9 9 0 0 0-7 21z" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <span class="deco deco--ambient" style="top:24%; left:2%; font-family:monospace; font-size:1.2rem; opacity:.35;">{ }</span>
      <span class="deco deco--ambient deco--star" style="top:30%; right:4%; font-size:.75rem;">✧</span>
      <span class="deco deco--ambient" style="top:44%; left:6%; font-family:monospace; font-size:.72rem; letter-spacing:.1em; opacity:.35;">01001010</span>
      <span class="deco deco--ambient" style="top:52%; right:3%; width:52px;">
        <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="4" width="48" height="30" rx="3" stroke="currentColor" stroke-width="2"/><text x="32" y="23" text-anchor="middle" font-size="12" font-family="monospace" fill="currentColor">&lt;/&gt;</text><path d="M2 40 L62 40 L56 46 L8 46 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </span>
      <span class="deco deco--ambient deco--star" style="top:66%; left:3%; font-size:.9rem;">✦</span>
      <span class="deco deco--ambient" style="bottom:20%; right:8%; font-family:monospace; font-size:1rem; opacity:.35;">&lt;/&gt;</span>
      <span class="deco deco--ambient deco--star" style="bottom:12%; left:8%; font-size:.7rem;">✧</span>
      <span class="deco deco--ambient deco--cloud" style="bottom:4%; right:20%; width:40px; opacity:.25;">
        <svg viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M18 30h30a9 9 0 0 0 0-18 12 12 0 0 0-23-3 9 9 0 0 0-7 21z" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <span class="deco deco--ambient deco--star" style="top:38%; left:34%; font-size:.65rem;">✧</span>
      <span class="deco deco--ambient" style="top:58%; right:34%; font-family:monospace; font-size:.9rem; opacity:.3;">{ }</span>
      <span class="deco deco--ambient deco--star" style="top:18%; left:44%; font-size:.8rem;">✦</span>
      <span class="deco deco--ambient" style="bottom:34%; left:18%; font-family:monospace; font-size:.65rem; letter-spacing:.1em; opacity:.3;">01000011</span>
      <span class="deco deco--ambient deco--flower" style="top:70%; right:16%; width:24px; opacity:.3;">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="11" r="6"/><circle cx="20" cy="29" r="6"/><circle cx="11" cy="20" r="6"/><circle cx="29" cy="20" r="6"/><circle cx="20" cy="20" r="3.5" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="deco deco--ambient deco--star" style="bottom:44%; right:6%; font-size:.7rem;">✧</span>
    </div>
    <div class="scene__inner">
      <p class="eyebrow" data-reveal>Work</p>
      <h1 class="section-heading" data-reveal>[WORK INDEX HEADING]</h1>
      <p class="page-work__intro" data-reveal>A short introduction to the full portfolio archive goes here. Browse everything, or filter by category.</p>
      <div class="category-list" data-category-list></div>
    </div>
    <div class="work__field" data-work-field></div>
  </section>
</main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
